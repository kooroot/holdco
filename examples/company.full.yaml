# yaml-language-server: $schema=node_modules/@holdco/kernel/schema/company.schema.json
# Generated by `holdco init --preset full`. Owned by the Operator; locked for every agent.
# Check edits with `holdco config check company.yaml`.

version: 1
company:
  name: example-co
  mission: Ship and operate payment infrastructure that agents can use safely.
  timezone: Asia/Seoul
operator:
  github: OPERATOR
alerts:
  channels:
    - type: telegram
      bot_token_env: TELEGRAM_BOT_TOKEN
      chat_id: "123456789"
  heartbeat_url_env: HEARTBEAT_URL
runtime:
  host: linux-systemd
  tick: 60s
  max_concurrent_sessions: 4
  session_timeout: 45m
  lease_grace: 5m
  max_attempts: 3
modules:
  executive: ceo+coo
  departments:
    - research
    - engineering
    - gtm
    - operations
  improvement:
    enabled: true
    replay_min_tickets: 20
  auto_graduation: true
  juniors:
    enabled: true
    max_per_task: 5
engines:
  claude:
    auth: subscription
    auth_env: ANTHROPIC_API_KEY
  codex:
    auth_env: OPENAI_API_KEY
    prices:
      gpt-6-astra:
        input_per_mtok: 10
        cached_input_per_mtok: 1
        output_per_mtok: 50
      gpt-6.1-sol:
        input_per_mtok: 2
        cached_input_per_mtok: 0.1
        output_per_mtok: 10
      gpt-6-luna:
        input_per_mtok: 0.1
        cached_input_per_mtok: 0.01
        output_per_mtok: 0.5
roles:
  ceo:
    engine: claude
    model: opus
  coo:
    engine: codex
    model: gpt-6.1-sol
    effort: high
  senior:
    engine: claude
    model: opus
  verification:
    engine: codex
    model: gpt-6-astra
    effort: high
  improvement:
    engine: claude
    model: opus
  junior_worker:
    engine: claude
    model: sonnet
  junior_reader:
    engine: claude
    model: haiku
  by_department:
    gtm:
      engine: claude
      model: sonnet
budget:
  monthly_usd: 400
  session_max_usd: 5
  shares:
    engineering: 0.35
    research: 0.1
    gtm: 0.1
    operations: 0.05
    verification: 0.15
    executive: 0.15
    improvement: 0.1
  provider_cap_set: true
projects:
  - id: main-product
    path: ../main-product
    class: core
    share: 0.6
    locked:
      - CLAUDE.md
      - AGENTS.md
      - .github/**
      - contracts/**
  - id: side-bet
    path: ../side-bet
    class: experiment
    share: 0.15
    locked:
      - CLAUDE.md
      - AGENTS.md
      - .github/**
    kill_criteria: No paying user by 2027-01-31
  - id: tools
    path: ../tools
    class: maintenance
    share: 0.1
    locked:
      - CLAUDE.md
      - AGENTS.md
      - .github/**
policy:
  windows:
    t2_internal: 24h
    t2_external: 72h
  t3:
    spend_per_action_usd: 50
    spend_monthly_usd: 200
  inbox:
    batch_at: 09:00
    timeout: 72h
  digest:
    day: sat
    at: 10:00
  release:
    day: sat
    at: 12:00
    min_gain: 0.02
    max_regression: 0.01
    watch: 3d
    canary_traffic: 0.2
  audit:
    weekly_sample: 10
    gtm_multiplier: 2
    freeze_after_missed: 2
  graduation:
    samples: 30
    agreement: 0.95
    demotion_agreement: 0.85
    demotion_window: 20
  tripwires:
    dept_spend_spike_x: 3
    loop_threshold: 5
  delegation:
    max_iterations: 2
    restate_threshold: 60m
  executive:
    ceo_cycle: 24h
    allocation_shift_t2: 0.1
    canary_rate: 0.05
    blocked_after: 8h
    rubber_stamp_weeks: 4
    high_disagreement: 0.3
envelopes:
  - id: paid-data
    scope: paid research data and third-party APIs
    limit: 30
    unit: usd
    period: monthly
    on_exceed: escalate_t2
  - id: social-posting
    scope: posts on company-owned accounts
    limit: 5
    unit: count
    period: weekly
    on_exceed: queue_t2
  - id: testnet-deploy
    scope: deploys to non-production networks and staging
    limit: 50
    unit: count
    period: daily
    on_exceed: escalate_t2
actions:
  - id: verdict.issue
    department: verification
    tier: T0
    evaluator: calibration
    gates: []
    graduation: never
  - id: executive.reallocate
    department: executive
    tier: T2
    gates: []
    graduation: never
  - id: research.report
    department: research
    tier: T0
    evaluator: research.md
    gates: []
    graduation: auto
  - id: research.paid-source
    department: research
    tier: T1
    evaluator: research.md
    envelope: paid-data
    gates: []
    graduation: auto
  - id: code.branch
    department: engineering
    tier: T0
    evaluator: "engineering.md#app"
    gates: []
    graduation: auto
  - id: code.merge.docs
    department: engineering
    tier: T2
    evaluator: "engineering.md#docs"
    gates:
      - ci-green
      - verification-approved
    graduation: auto
  - id: code.merge.app
    department: engineering
    tier: T2
    evaluator: "engineering.md#app"
    gates:
      - ci-green
      - verification-approved
    graduation: auto
  - id: code.merge.contracts
    department: engineering
    tier: T3
    evaluator: "verification.md#security"
    gates:
      - ci-green
      - verification-approved
    graduation: never
  - id: content.draft
    department: gtm
    tier: T0
    evaluator: "gtm.md#post"
    gates: []
    graduation: auto
  - id: content.publish.company
    department: gtm
    tier: T1
    evaluator: "gtm.md#post"
    envelope: social-posting
    gates:
      - verification-approved
    graduation: auto
  - id: operator.publish
    department: gtm
    tier: T3
    gates: []
    graduation: never
  - id: legal.submit-application
    department: gtm
    tier: T3
    gates: []
    graduation: never
  - id: ops.observe
    department: operations
    tier: T0
    evaluator: "operations.md#observe"
    gates: []
    graduation: never
  - id: deploy.staging
    department: operations
    tier: T1
    evaluator: operations.md
    envelope: testnet-deploy
    gates:
      - ci-green
      - verification-approved
    graduation: auto
  - id: deploy.production
    department: operations
    tier: T2
    evaluator: operations.md
    gates:
      - rollback-tested
    graduation: auto
  - id: prod.irreversible.mainnet-deploy
    department: operations
    tier: T3
    gates: []
    graduation: never
  - id: credentials.grant
    department: operations
    tier: T3
    gates: []
    graduation: never
  - id: improvement.merge
    department: improvement
    tier: T1
    evaluator: replay
    gates:
      - replay-gain
      - canary-clean
    graduation: never
  - id: governance.exec-definition-change
    department: improvement
    tier: T3
    gates:
      - replay-gain
    graduation: never