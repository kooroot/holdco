# yaml-language-server: $schema=node_modules/@holdco/kernel/schema/company.schema.json
# Generated by `holdco init --preset solo-dev`. Owned by the Operator; locked for every agent.
# Check edits with `holdco config check company.yaml`.

version: 1
company:
  name: solo-co
  mission: Build and ship one product with as little of my time as possible.
  timezone: Asia/Seoul
operator:
  github: OPERATOR
alerts:
  channels:
    - type: slack
      webhook_env: SLACK_WEBHOOK_URL
runtime:
  host: macos-launchd
  tick: 120s
  max_concurrent_sessions: 2
  session_timeout: 30m
  lease_grace: 5m
  max_attempts: 2
modules:
  executive: ceo
  departments:
    - engineering
  improvement:
    enabled: false
    replay_min_tickets: 20
  auto_graduation: false
  juniors:
    enabled: true
    max_per_task: 3
engines:
  claude:
    auth_env: ANTHROPIC_API_KEY
roles:
  ceo:
    engine: claude
    model: opus
  senior:
    engine: claude
    model: opus
  verification:
    engine: claude
    model: fable
  junior_worker:
    engine: claude
    model: sonnet
  junior_reader:
    engine: claude
    model: haiku
budget:
  monthly_usd: 100
  session_max_usd: 3
  shares:
    engineering: 0.6
    verification: 0.25
    executive: 0.15
  provider_cap_set: false
projects:
  - id: app
    path: ../app
    class: core
    share: 1
    locked:
      - CLAUDE.md
      - AGENTS.md
      - .github/**
policy:
  windows:
    t2_internal: 24h
    t2_external: 72h
  t3:
    spend_per_action_usd: 20
    spend_monthly_usd: 50
  inbox:
    batch_at: 09:00
    timeout: 72h
  digest:
    day: sun
    at: 20:00
  release:
    day: sat
    at: 12:00
    min_gain: 0.02
    max_regression: 0.01
    watch: 3d
    canary_traffic: 0.2
  audit:
    weekly_sample: 5
    gtm_multiplier: 2
    freeze_after_missed: 2
  graduation:
    samples: 30
    agreement: 0.95
    demotion_agreement: 0.85
    demotion_window: 20
  tripwires:
    dept_spend_spike_x: 3
    loop_threshold: 5
  delegation:
    max_iterations: 2
    restate_threshold: 60m
  executive:
    ceo_cycle: 24h
    allocation_shift_t2: 0.2
    canary_rate: 0
    blocked_after: 12h
    rubber_stamp_weeks: 4
    high_disagreement: 0.3
envelopes: []
actions:
  - id: verdict.issue
    department: verification
    tier: T0
    evaluator: calibration
    gates: []
    graduation: never
  - id: executive.reallocate
    department: executive
    tier: T2
    gates: []
    graduation: never
  - id: code.branch
    department: engineering
    tier: T0
    evaluator: "engineering.md#app"
    gates: []
    graduation: auto
  - id: code.merge.docs
    department: engineering
    tier: T2
    evaluator: "engineering.md#docs"
    gates:
      - ci-green
      - verification-approved
    graduation: auto
  - id: code.merge.app
    department: engineering
    tier: T2
    evaluator: "engineering.md#app"
    gates:
      - ci-green
      - verification-approved
    graduation: auto
  - id: code.merge.contracts
    department: engineering
    tier: T3
    evaluator: "verification.md#security"
    gates:
      - ci-green
      - verification-approved
    graduation: never